<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Celebrity Fitness Studio</title>
  <link rel="icon" href="/static/images/logo.png" type="image/png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="/static/images/logo.png" alt="Celebrity Fitness Studio" class="login-logo">
      <h1>Celebrity Fitness Studio</h1>
      <p class="subtitle">Fit Today, Strong Tomorrow</p>
      <div class="alert alert-info" style="margin-bottom:1.25rem;text-align:left">
        <strong>First time here?</strong><br>
        Username: <strong>admin</strong><br>
        Password: <strong>admin123</strong>
      </div>
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="form-group" style="margin-bottom:1rem">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:1.5rem">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--muted)">
        Staff login: staff / staff123
      </p>
    </div>
  </div>
</body>
</html>
