<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gym Management</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Gym<span style="color:var(--accent)">Admin</span></h1>
      <p class="subtitle">Local Gym Management System</p>
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="form-group" style="margin-bottom:1rem">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:1.5rem">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--muted)">
        Default: admin/admin123 or staff/staff123
      </p>
    </div>
  </div>
</body>
</html>
