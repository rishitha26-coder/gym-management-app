{% extends "base.html" %}
{% block title %}{{ title }} - Celebrity Fitness Studio{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<form method="post" action="{{ action }}" enctype="multipart/form-data">
  <div class="card">
    <div class="form-grid">
      <div class="form-group">
        <label for="full_name">Full Name *</label>
        <input type="text" id="full_name" name="full_name" required
               value="{{ member.full_name if member else '' }}">
      </div>
      <div class="form-group">
        <label for="phone">Phone * (unique)</label>
        <input type="tel" id="phone" name="phone" required
               value="{{ member.phone if member else '' }}">
      </div>
      <div class="form-group">
        <label for="date_of_joining">Date of Joining *</label>
        <input type="date" id="date_of_joining" name="date_of_joining" required
               value="{{ member.date_of_joining if member else '' }}">
      </div>
      <div class="form-group">
        <label for="plan_months">Membership Plan *</label>
        <select id="plan_months" name="plan_months" required>
          {% for value, label in plans %}
          <option value="{{ value }}" {% if member and member.plan_months == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="fee_paid">Fee Paid (₹) *</label>
        <input type="number" id="fee_paid" name="fee_paid" step="0.01" min="0" required
               value="{{ member.fee_paid if member else '' }}">
      </div>
      <div class="form-group">
        <label for="payment_date">Payment Date</label>
        <input type="date" id="payment_date" name="payment_date"
               value="{{ member.payment_date if member and member.payment_date else '' }}">
      </div>
      <div class="form-group">
        <label for="payment_method">Payment Method</label>
        <select id="payment_method" name="payment_method">
          <option value="">— Select —</option>
          {% for method in payment_methods %}
          <option value="{{ method }}" {% if member and member.payment_method == method %}selected{% endif %}>{{ method }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="personal_training_amount">Personal Training Amount (₹)</label>
        <input type="number" id="personal_training_amount" name="personal_training_amount"
               step="0.01" min="0" placeholder="Leave empty for NA"
               value="{{ member.personal_training_amount if member and member.personal_training_amount else '' }}">
      </div>
      <div class="form-group">
        <label for="balance">Balance (₹)</label>
        <input type="number" id="balance" name="balance" step="0.01" min="0"
               value="{{ member.balance if member and member.balance is not none else '' }}">
      </div>
      <div class="form-group">
        <label for="photo">Photo (optional)</label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes">{{ member.notes if member and member.notes else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Member</button>
      <a href="{% if member %}/members/{{ member.id }}{% else %}/{% endif %}" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
