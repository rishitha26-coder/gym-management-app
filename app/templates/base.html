<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Celebrity Fitness Studio{% endblock %}</title>
  <link rel="icon" href="/static/images/logo.png" type="image/png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="layout">
    <aside class="sidebar">
      <a href="/" class="brand brand-compact" title="Celebrity Fitness Studio">
        <img src="/static/images/logo.png" alt="Celebrity Fitness Studio" class="brand-logo">
        <span class="brand-name">Celebrity <span>Fitness</span></span>
      </a>
      <nav class="sidebar-nav">
        <a href="/" class="nav-link nav-link-compact {% if request.url.path == '/' %}active{% endif %}" title="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="/members" class="nav-link nav-link-compact {% if request.url.path == '/members' %}active{% endif %}" title="Members">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-label">Members</span>
        </a>
        <a href="/members/add" class="nav-link nav-link-compact {% if '/members/add' in request.url.path %}active{% endif %}" title="Add Member">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
          <span class="nav-label">Add</span>
        </a>
        <a href="/search" class="nav-link nav-link-compact {% if request.url.path == '/search' %}active{% endif %}" title="Search">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="nav-label">Search</span>
        </a>
        <a href="/renewals" class="nav-link nav-link-compact {% if request.url.path == '/renewals' %}active{% endif %}" title="Renewals">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          <span class="nav-label">Renewals</span>
        </a>
        <a href="/reports" class="nav-link nav-link-compact {% if request.url.path.startswith('/reports') %}active{% endif %}" title="Reports">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 3v18h18"/><path d="m7 16 4-4 4 4 5-6"/></svg>
          <span class="nav-label">Reports</span>
        </a>
      </nav>
      <div class="sidebar-spacer"></div>
      <a href="/logout" class="nav-link nav-link-compact nav-link-logout" title="Logout">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="nav-label">Logout</span>
      </a>
    </aside>
    <main class="main">
      {% block page_header %}
      <div class="header">
        <div>
          <h1>{% block page_title %}Dashboard{% endblock %}</h1>
          {% block page_subtitle %}{% endblock %}
        </div>
        {% if user %}
        <div class="user-badge">
          <span class="role-badge role-badge-{{ user.role.value }}">{{ user.role_label }}</span>
        </div>
        {% endif %}
      </div>
      {% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
