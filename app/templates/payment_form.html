{% extends "base.html" %}
{% block title %}Payment Update - {{ member.full_name }}{% endblock %}
{% block page_title %}Update Payment{% endblock %}
{% block content %}
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<div class="card">
  <p style="margin-bottom:1rem;color:var(--muted)">Updating payment for <strong style="color:var(--text)">{{ member.full_name }}</strong> ({{ member.phone }})</p>
  <form method="post" action="/members/{{ member.id }}/payment">
    <div class="form-grid">
      <div class="form-group">
        <label for="fee_paid">Fee Paid (₹) *</label>
        <input type="number" id="fee_paid" name="fee_paid" step="0.01" min="0" required
               value="{{ member.fee_paid }}">
      </div>
      <div class="form-group">
        <label for="payment_date">Payment Date *</label>
        <input type="date" id="payment_date" name="payment_date" required
               value="{{ member.payment_date or '' }}">
      </div>
      <div class="form-group">
        <label for="payment_method">Payment Method *</label>
        <select id="payment_method" name="payment_method" required>
          {% for method in payment_methods %}
          <option value="{{ method }}" {% if member.payment_method == method %}selected{% endif %}>{{ method }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="plan_months">Membership Plan</label>
        <select id="plan_months" name="plan_months">
          <option value="">— Keep current —</option>
          {% for value, label in plans %}
          <option value="{{ value }}" {% if member.plan_months == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="personal_training_amount">Personal Training (₹)</label>
        <input type="number" id="personal_training_amount" name="personal_training_amount"
               step="0.01" min="0" placeholder="NA if empty"
               value="{{ member.personal_training_amount if member.personal_training_amount else '' }}">
      </div>
      <div class="form-group">
        <label for="balance">Balance (₹)</label>
        <input type="number" id="balance" name="balance" step="0.01" min="0"
               value="{{ member.balance if member.balance is not none else '' }}">
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" name="extend_renewal" style="width:auto;margin-right:0.5rem">
          Extend renewal from payment date
        </label>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Payment</button>
      <a href="/members/{{ member.id }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
